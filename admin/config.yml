# Website editor for Delhi Public School Visakhapatnam Steel Plant.
# Setup notes are in SETUP.md. Only change `repo` below (see step 2 there).

backend:
  name: github
  repo: dpsvisakhapatnam/dps-visakhapatnam-website
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Remove {{collection}} “{{slug}}”"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

local_backend: true        # lets the developer test at http://localhost:5173/admin (ignored on the live site)
media_folder: "uploads"
public_folder: "/uploads"
site_url: https://www.dpsvisakhapatnam.org
display_url: https://www.dpsvisakhapatnam.org
logo_url: /assets/dpslogo.png
locale: en
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: notices
    label: "📢 Notice bar (top of every page)"
    description: "The short scrolling messages shown in the green bar at the very top of the website."
    files:
      - name: notices
        label: "Notice bar messages"
        file: content/notices.json
        format: json
        fields:
          - label: "Messages"
            label_singular: "message"
            name: items
            widget: list
            summary: "{{fields.text}}"
            hint: "Keep each message short. The first ones appear first. Delete a message to remove it."
            fields:
              - { label: "Message", name: text, widget: string }
              - { label: "Link", name: link, widget: string, required: false, hint: "A page like news.html or resources.html#assignments, or a full web address starting with https://" }

  - name: circulars
    label: "📄 Circulars"
    description: "Notices for parents and students. Newest dated circular shows first."
    files:
      - name: circulars
        label: "All circulars"
        file: content/circulars.json
        format: json
        fields:
          - label: "Circulars"
            label_singular: "circular"
            name: items
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            hint: "Click “Add circular”, type a title, pick the date and upload the PDF."
            add_to_top: true
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Date", name: date, widget: datetime, date_format: "DD MMM YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "PDF or image file", name: file, widget: file }

  - name: school_documents
    label: "📚 Assignments, syllabus & books"
    description: "Class-wise downloads for students and parents."
    files:
      - name: assignments
        label: "Assignments"
        file: content/assignments.json
        format: json
        fields:
          - { label: "Section heading", name: heading, widget: string, default: "Assignments for all classes" }
          - { label: "Short note under the heading", name: note, widget: text, required: false }
          - label: "Class assignments"
            label_singular: "class"
            name: items
            widget: list
            summary: "{{fields.label}}"
            hint: "To replace a class’s PDF, open that class and upload a new file. To add a class, click “Add class”."
            fields:
              - { label: "Class (as shown on the button)", name: label, widget: string, hint: "e.g. Class 7 or Class 12 Science" }
              - { label: "PDF file", name: file, widget: file }
      - name: syllabus
        label: "Syllabus break-up"
        file: content/syllabus.json
        format: json
        fields:
          - { label: "Section heading", name: heading, widget: string, default: "Syllabus for all classes" }
          - { label: "Short note under the heading", name: note, widget: text, required: false }
          - label: "Class syllabus"
            label_singular: "class"
            name: items
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Class", name: label, widget: string }
              - { label: "PDF file", name: file, widget: file }
      - name: booklist
        label: "Book list"
        file: content/booklist.json
        format: json
        fields:
          - { label: "Title", name: title, widget: string, hint: "e.g. Book list — academic year 2027-28" }
          - { label: "PDF file", name: file, widget: file }
      - name: magazine
        label: "School magazine"
        file: content/magazine.json
        format: json
        fields:
          - { label: "Magazine name", name: title, widget: string }
          - { label: "Subtitle (year / edition)", name: subtitle, widget: string, required: false }
          - { label: "PDF file", name: file, widget: file }

  - name: news_results
    label: "🏆 News, achievements & results"
    description: "Stories on the News page and the home page, and the board results section."
    files:
      - name: news
        label: "News & achievements"
        file: content/news.json
        format: json
        fields:
          - label: "News items"
            label_singular: "news item"
            name: items
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            add_to_top: true
            hint: "Newest dated item shows first. Items without a date appear after dated ones."
            fields:
              - { label: "Headline", name: title, widget: string }
              - { label: "Type", name: category, widget: select, options: ["Achievement", "News", "Event", "Announcement"], default: "News" }
              - { label: "Date", name: date, widget: datetime, date_format: "DD MMM YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "Short description", name: summary, widget: text, required: false }
              - { label: "Photo or poster", name: image, widget: image, allow_multiple: false, required: false, hint: "Keep photos under about 2 MB." }
              - { label: "Link", name: link, widget: string, required: false }
      - name: results
        label: "Board results (home page)"
        file: content/results.json
        format: json
        fields:
          - { label: "Session", name: session, widget: string, hint: "e.g. 2025–26" }
          - { label: "Line under the heading", name: tagline, widget: string, required: false }
          - label: "Class X"
            name: classX
            widget: object
            fields:
              - { label: "Topper’s percentage", name: percent, widget: string, hint: "Numbers only, e.g. 98.8" }
              - { label: "Topper’s name", name: name, widget: string }
              - { label: "Class average", name: average, widget: string }
              - { label: "Students appeared", name: appeared, widget: string }
              - { label: "Students passed", name: passed, widget: string }
              - { label: "Result poster (optional)", name: poster, widget: image, allow_multiple: false, required: false }
          - label: "Class XII"
            name: classXII
            widget: object
            fields:
              - { label: "Topper’s percentage", name: percent, widget: string }
              - { label: "Topper’s name", name: name, widget: string }
              - { label: "Class average", name: average, widget: string }
              - { label: "Students appeared", name: appeared, widget: string }
              - { label: "Students passed", name: passed, widget: string }
              - { label: "Result poster (optional)", name: poster, widget: image, allow_multiple: false, required: false }
          - { label: "Chart title", name: chart_title, widget: string, required: false }
          - label: "Chart: Class X average by year"
            label_singular: "year"
            name: chart
            widget: list
            summary: "{{fields.year}} · {{fields.average}}"
            fields:
              - { label: "Year", name: year, widget: string, hint: "e.g. 2026-27" }
              - { label: "Class average (%)", name: average, widget: string }

  - name: photos
    label: "🖼️ Photo gallery"
    description: "Photos shown on the home page and the Gallery page."
    files:
      - name: gallery
        label: "Latest activities (photos)"
        file: content/gallery.json
        format: json
        fields:
          - label: "Photos"
            name: items
            label_singular: "photo"

            widget: list
            summary: "{{fields.caption}}"
            add_to_top: true
            hint: "New photos go to the top. The home page shows the first 16. Please keep each photo under about 2 MB."
            fields:
              - { label: "Photo", name: image, widget: image, allow_multiple: false }
              - { label: "Caption", name: caption, widget: string }
              - { label: "Group", name: category, widget: select, options: [{ label: "Ceremonies", value: ceremony }, { label: "Culture", value: culture }, { label: "Sports & wellness", value: sports }], default: culture }
              - { label: "Show larger (double width)", name: wide, widget: boolean, default: false, required: false }
              - { label: "Short description for accessibility (optional)", name: alt, widget: string, required: false }
      - name: albums
        label: "Event albums"
        file: content/albums.json
        format: json
        fields:
          - label: "Albums"
            label_singular: "album"
            name: items
            widget: list
            summary: "{{fields.title}}"
            add_to_top: true
            fields:
              - { label: "Album name", name: title, widget: string, hint: "e.g. Annual Day 2026" }
              - { label: "Year", name: year, widget: string, required: false, hint: "e.g. 2026-27" }
              - { label: "Photos (the first one is the cover)", name: photos, widget: image, allow_multiple: true, hint: "You can pick several photos at once." }

  - name: people
    label: "👥 Faculty & staff"
    description: "The people shown on the Faculty & Staff page."
    files:
      - name: staff
        label: "Faculty & staff"
        file: content/staff.json
        format: json
        fields:
          - label: "School leadership (Principal and coordinators)"
            name: leadership
            widget: list
            label_singular: "person"
            summary: "{{fields.name}} · {{fields.role}}"
            hint: "Shown first on the page, in this order. Drag to reorder."
            fields: &person_fields
              - { label: "Name", name: name, widget: string }
              - { label: "Designation", name: role, widget: string, hint: "e.g. PGT, TGT, PRT, Principal, UDC, Watchman" }
              - { label: "Qualification", name: qualification, widget: string, required: false }
              - { label: "Photo", name: photo, widget: image, allow_multiple: false, required: false, hint: "A head-and-shoulders photo works best. Without a photo, initials are shown." }
          - label: "Teachers"
            name: teachers
            widget: list
            label_singular: "teacher"
            summary: "{{fields.name}} · {{fields.role}}"
            add_to_top: true
            hint: "New teachers appear at the top of this list. To remove a teacher who has left, click the × on their row."
            fields: *person_fields
          - label: "Office staff"
            name: office
            widget: list
            label_singular: "person"
            summary: "{{fields.name}} · {{fields.role}}"
            fields: *person_fields
          - label: "Support staff"
            name: support
            widget: list
            label_singular: "person"
            summary: "{{fields.name}} · {{fields.role}}"
            fields: *person_fields

  - name: fees_collection
    label: "💰 Fee structure"
    description: "The fee table and the scan on the Admissions page."
    files:
      - name: fees
        label: "Fee structure"
        file: content/fees.json
        format: json
        fields:
          - { label: "Heading above the table", name: session, widget: string, hint: "e.g. Session 2027-28" }
          - { label: "Name of first fee column", name: col1, widget: string, hint: "e.g. VSP (₹)" }
          - { label: "Name of second fee column", name: col2, widget: string, hint: "e.g. NVSP (₹)" }
          - label: "Fee groups"
            name: groups
            widget: list
            label_singular: "fee group"
            summary: "{{fields.heading}}"
            hint: "Each group has a heading (e.g. Tuition fee, per month) and rows of fees."
            fields:
              - { label: "Group heading", name: heading, widget: string }
              - label: "Fees"
                name: rows
                widget: list
                label_singular: "fee"
                summary: "{{fields.item}} · {{fields.vsp}} / {{fields.nvsp}}"
                fields:
                  - { label: "Fee head", name: item, widget: string, hint: "e.g. Class III to V" }
                  - { label: "Amount, first column", name: vsp, widget: string, hint: "Type numbers as you want them shown, e.g. 2,970" }
                  - { label: "Amount, second column", name: nvsp, widget: string }
          - { label: "Note under the table", name: note, widget: text, required: false }
          - { label: "Official scan (image) of the signed fee structure", name: scan, widget: image, allow_multiple: false, required: false, hint: "Upload a clear photo or scan. It is shown beside the table and can be downloaded." }

  - name: disclosure_collection
    label: "📋 Mandatory public disclosure"
    description: "The CBSE disclosure page: general information, documents, board results, staff, infrastructure, committees and PTA."
    files:
      - name: disclosure
        label: "Mandatory public disclosure"
        file: content/disclosure.json
        format: json
        fields:
          - { label: "Page heading", name: title, widget: string, default: "Appendix-IX" }
          - { label: "Line under the heading", name: subtitle, widget: string, required: false }
          - label: "A. General information"
            name: general
            widget: list
            label_singular: "row"
            summary: "{{fields.item}}"
            fields: &kv_fields
              - { label: "Item", name: item, widget: string }
              - { label: "Details", name: detail, widget: text }
          - label: "B. Documents and certificates"
            name: documents
            widget: list
            label_singular: "document"
            summary: "{{fields.item}}"
            hint: "Upload the PDF to show a “Click here to view” link. If there is no document, leave the file empty and type N.A. in the note."
            fields: &doc_fields
              - { label: "Document name", name: item, widget: text }
              - { label: "File (PDF or image)", name: file, widget: file, required: false }
              - { label: "Note (shown if there is no file)", name: note, widget: string, required: false }
          - label: "C. Result and academics: documents"
            name: academics_docs
            widget: list
            label_singular: "document"
            summary: "{{fields.item}}"
            fields: *doc_fields
          - label: "Board results: Class X"
            name: results_x
            widget: list
            label_singular: "year"
            summary: "{{fields.year}}"
            add_to_top: false
            hint: "Add a new row each year after the board results."
            fields:
              - { label: "Year", name: year, widget: string, hint: "e.g. 2025-26" }
              - { label: "No. of registered students", name: registered, widget: string }
              - { label: "No. of students passed", name: passed, widget: string }
              - { label: "Pass percentage", name: percent, widget: string, hint: "e.g. 100%" }
              - { label: "Class average", name: average, widget: string, hint: "e.g. 85.2%" }
              - { label: "Total no. of distinctions", name: distinctions, widget: string }
              - { label: "Distinction ratio", name: ratio, widget: string }
              - { label: "Remarks", name: remarks, widget: string, required: false }
          - label: "Board results: Class XII"
            name: results_xii
            widget: list
            label_singular: "year"
            summary: "{{fields.year}}"
            fields:
              - { label: "Year", name: year, widget: string }
              - { label: "No. of registered students", name: registered, widget: string }
              - { label: "No. of students passed", name: passed, widget: string }
              - { label: "Pass percentage", name: percent, widget: string }
              - { label: "Remarks", name: remarks, widget: string, required: false }
          - label: "D. Staff (teaching)"
            name: staff
            widget: list
            label_singular: "row"
            summary: "{{fields.item}}"
            fields: *kv_fields
          - label: "E. School infrastructure"
            name: infrastructure
            widget: list
            label_singular: "row"
            summary: "{{fields.item}}"
            fields: *kv_fields
          - label: "School information"
            name: school_info
            widget: list
            label_singular: "row"
            summary: "{{fields.item}}"
            fields: *kv_fields
          - label: "School Managing Committee members"
            name: smc
            widget: list
            label_singular: "member"
            summary: "{{fields.name}} · {{fields.post}}"
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Post held", name: post, widget: string }
              - { label: "Address", name: address, widget: text }
              - { label: "Tenure", name: tenure, widget: string }
          - { label: "Sentence above the committees list", name: committees_note, widget: text, required: false }
          - label: "Committees"
            name: committees
            widget: list
            label_singular: "committee"
            summary: "{{fields.committee}}"
            fields:
              - { label: "Committee", name: committee, widget: string }
              - { label: "Members", name: members, widget: text }
          - label: "PTA members (class and name only)"
            name: pta
            widget: list
            label_singular: "member"
            summary: "{{fields.class}} · {{fields.name}}"
            fields:
              - { label: "Class", name: class, widget: string }
              - { label: "Member name", name: name, widget: string }
          - { label: "Full PTA list (PDF with contact details)", name: pta_file, widget: file, required: false }
          - { label: "Affiliation letter (PDF)", name: affiliation_file, widget: file, required: false }

  - name: uniform_collection
    label: "👕 School uniform"
    description: "The uniform rules shown on the Admissions page."
    files:
      - name: uniform
        label: "School uniform"
        file: content/uniform.json
        format: json
        fields:
          - { label: "Introduction", name: intro, widget: text }
          - label: "Uniform sets (Boys / Girls, Summer / Winter)"
            name: sets
            widget: list
            label_singular: "set"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Heading", name: heading, widget: string, hint: "e.g. Boys · Summer" }
              - label: "Class groups"
                name: groups
                widget: list
                label_singular: "class group"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Classes", name: title, widget: string, hint: "e.g. Class III to VII" }
                  - { label: "Items of the uniform", name: items, widget: list, label_singular: "item", field: { label: "Item", name: item, widget: string } }
          - label: "Notes"
            name: notes
            widget: list
            label_singular: "note"
            field: { label: "Note", name: note, widget: string }

  # ------------------------------------------------------------------ page text & sections
  - name: pages_home
    label: "📝 Page text: Home"
    description: "Texts and sections of the home page."
    files:
      - name: page_index
        label: "Home page"
        file: content/page-index.json
        format: json
        fields:
          - { label: "Show Admissions promotions (home page and page bottoms)", name: show_admissions, widget: boolean, default: false, hint: "Switch ON when admissions open (shows the Admissions button, the Admissions card, the “Join the DPS family” section and the “How admissions work” button at the bottom of pages). Switch OFF to hide them again." }
          - { label: "Line above the main heading", name: hero_eyebrow, widget: string }
          - { label: "Welcome sentence under the heading", name: hero_lead, widget: text }
          - label: "Highlight numbers (green strip)"
            name: stats
            widget: list
            label_singular: "highlight"
            summary: "{{fields.number}} · {{fields.label}}"
            fields:
              - { label: "Number", name: number, widget: string, hint: "e.g. 100% or 13" }
              - { label: "Label", name: label, widget: string }
          - { label: "About the school (home page text)", name: about_md, widget: markdown }
          - label: "“Why DPS” cards"
            name: why
            widget: list
            label_singular: "card"
            summary: "{{fields.title}}"
            fields: &icon_card_fields
              - { label: "Icon", name: icon, widget: select, options: [{ label: "Trophy", value: trophy }, { label: "Science flask", value: flask }, { label: "Computer", value: monitor }, { label: "Library", value: lib }, { label: "Running", value: run }, { label: "Arts palette", value: palette }, { label: "Globe", value: globe }, { label: "Heart", value: heart }, { label: "Book", value: book }, { label: "Graduation cap", value: cap }, { label: "People", value: users }, { label: "Shield", value: shield }, { label: "Music", value: music }, { label: "Bus", value: bus }, { label: "Sparkle", value: sparkle }], default: sparkle }
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: text, widget: text }

  - name: pages_about
    label: "📝 Page text: About us"
    description: "School introduction, philosophy, principal’s message, DPS Society and mentors."
    files:
      - name: page_about
        label: "About page"
        file: content/page-about.json
        format: json
        fields:
          - { label: "School introduction", name: school_md, widget: markdown }
          - label: "Motto, philosophy, aim cards"
            name: pcards
            widget: list
            label_singular: "card"
            summary: "{{fields.title}}"
            fields:
              - { label: "Icon", name: icon, widget: select, options: [{ label: "Heart", value: heart }, { label: "Graduation cap", value: cap }, { label: "Globe", value: globe }, { label: "Book", value: book }, { label: "Trophy", value: trophy }, { label: "People", value: users }], default: heart }
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: body, widget: markdown }
          - { label: "Principal’s quote (large text)", name: principal_quote, widget: text, hint: "Also shown on the home page." }
          - { label: "Principal’s message (full text)", name: principal_md, widget: markdown }
          - { label: "DPS Society text", name: society_md, widget: markdown }
          - label: "Governing Body, DPS Society"
            name: gov
            widget: list
            label_singular: "member"
            summary: "{{fields.name}}"
            fields: &mentor_fields
              - { label: "Name", name: name, widget: string }
              - { label: "Position", name: role, widget: string }
              - { label: "Photo", name: photo, widget: image, allow_multiple: false, required: false }
          - label: "School Managing Committee"
            name: mc
            widget: list
            label_singular: "member"
            summary: "{{fields.name}}"
            fields: *mentor_fields

  - name: pages_academics
    label: "📝 Page text: Academics"
    description: "Teaching methodology, courses, awards policy, calendars, important days and staff training."
    files:
      - name: page_academics
        label: "Academics page"
        file: content/page-academics.json
        format: json
        fields:
          - { label: "Teaching methodology", name: methodology_md, widget: markdown }
          - { label: "Courses offered & promotion policy", name: courses_md, widget: markdown, hint: "Tables are supported." }
          - { label: "Awards & rewards policy", name: awards_md, widget: markdown, hint: "Tables are supported." }
          - label: "Calendars (shown as tabs)"
            name: calendars
            widget: list
            label_singular: "calendar"
            summary: "{{fields.title}}"
            hint: "Upload each calendar as an image (JPG or PNG). Add the newest first."
            fields:
              - { label: "Tab name", name: title, widget: string, hint: "e.g. School Calendar 2027-28" }
              - { label: "Image", name: image, widget: image, allow_multiple: false }
          - label: "Important days"
            name: days
            widget: list
            label_singular: "day"
            summary: "{{fields.month}}/{{fields.day}} · {{fields.title}}"
            hint: "For a fixed date fill Month and Day. For something like ‘2nd Sunday of May’ fill Month, Which Sunday-number and Weekday instead."
            fields:
              - { label: "Name of the day", name: title, widget: string }
              - { label: "Month (1-12)", name: month, widget: number, value_type: int, min: 1, max: 12 }
              - { label: "Date (1-31) — for fixed dates", name: day, widget: number, value_type: int, min: 1, max: 31, required: false }
              - { label: "Which one (1 = first … 4 = fourth) — for “Nth weekday” days", name: nth, widget: number, value_type: int, min: 1, max: 4, required: false }
              - { label: "Weekday — for “Nth weekday” days", name: weekday, widget: select, required: false, options: [{ label: "Sunday", value: 0 }, { label: "Monday", value: 1 }, { label: "Tuesday", value: 2 }, { label: "Wednesday", value: 3 }, { label: "Thursday", value: 4 }, { label: "Friday", value: 5 }, { label: "Saturday", value: 6 }] }
          - { label: "Student strength (image of the table)", name: strength_image, widget: image, allow_multiple: false }
          - label: "Staff training records"
            name: training
            widget: list
            label_singular: "record"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string, hint: "e.g. Workshop details 2026-27" }
              - { label: "PDF", name: file, widget: file }

  - name: pages_admissions
    label: "📝 Page text: Admissions"
    description: "Admission steps, withdrawal policy and FAQs. (Fees and uniform have their own sections.)"
    files:
      - name: page_admissions
        label: "Admissions page"
        file: content/page-admissions.json
        format: json
        fields:
          - label: "Admission steps (also shown on the home page)"
            name: steps
            widget: list
            label_singular: "step"
            summary: "{{fields.title}}"
            fields:
              - { label: "When", name: when, widget: string, hint: "e.g. Dec – Jan" }
              - { label: "Title", name: title, widget: string }
              - { label: "Details", name: text, widget: text }
          - { label: "Withdrawal procedure", name: withdrawal_md, widget: markdown }
          - label: "Frequently asked questions"
            name: faq
            widget: list
            label_singular: "question"
            summary: "{{fields.question}}"
            fields:
